</style></head><body><div class="overlay" id="overlay"></div><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">L</div><div><strong>Ville du Lamentin</strong><small>Intranet des agents</small></div></div><div><p class="nav-label">Espace de travail</p><nav class="nav" id="nav" aria-label="Navigation principale"></nav></div><div class="sidebar-bottom"><strong>Besoin d’aide ?</strong><p>Retrouvez les tutoriels et les contacts dans la rubrique Assistance.</p></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" id="menu" aria-label="Ouvrir le menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Rechercher un outil, un document..." aria-label="Rechercher dans l’intranet"></label><div class="top-actions"><span class="today" id="today"></span><span class="avatar" aria-hidden="true">AG</span><span class="top-name">Espace agent</span></div></header><div class="content" id="content"></div></main></div><div id="toast" class="toast" role="status" hidden></div><script>
const paths=['accueil','rh','documents','annuaire','outils','agenda','assistance'];const labels=['Accueil','Mon espace RH','Documents','Annuaire','Outils','Agenda','Assistance'];const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2zM17 6a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5"/>',file:'<path d="M6 2h8l5 5v15H6zM14 2v6h5M9 13h7M9 17h7"/>',book:'<path d="M4 3h16v18H4zM8 3v18M11 8h6M11 12h5"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2l-1.5 1.2V14M12 17h.01"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',mail:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="m2 6 10 7 10-7"/>',phone:'<path d="M7 3 4 5c-2 2 1 8 5 12s10 7 12 5l-2-4-4 1-6-6 1-4z"/>',folder:'<path d="M2 6h8l2 2h10v13H2z"/>',laptop:'<rect x="4" y="3" width="16" height="13" rx="1"/><path d="M2 20h20l-2-4H4z"/>',bell:'<path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 20h4"/>',arrow:'<path d="m8 5 7 7-7 7"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 20h16"/>',shield:'<path d="m12 2 8 3v6c0 5-3 9-8 11-5-2-8-6-8-11V5z"/>'};const svg=(key)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[key]||icons.file}</svg>`;
const tools=[['Kelio','Pointage et absences','clock'],['Gmail','Messagerie','mail'],['Digiposte','Bulletins de paie','file'],['GLPI','Assistance informatique','laptop'],['3CX','Téléphonie','phone'],['MAARCH','Gestion des courriers','folder']];const news=[['Nouvelle procédure de demande de congé','Retrouvez les étapes et le formulaire dans votre espace RH.','Ressources humaines','18 septembre 2026','file'],['Séminaire des agents : informations pratiques','Consultez le programme et les consignes pour la journée.','Vie de la collectivité','15 septembre 2026','users'],['Maintenance programmée de la GED','Une intervention technique est prévue sur MAARCH.','Informatique','12 septembre 2026','laptop']];const docs=[['Formulaire de demande de congé','Ressources humaines'],['Demande d’intervention informatique','Informatique'],['Modèle de courrier officiel','Administration'],['Charte informatique','Informatique'],['Organigramme de la collectivité','Direction générale']];const people=[['Accueil général','Standard et orientation','0590 00 00 00'],['Ressources humaines','Congés, paie et formation','Poste à renseigner'],['Service informatique','Matériel, comptes et logiciels','Poste à renseigner'],['Direction générale','Informations administratives','Poste à renseigner']];const sections=[['Ressources humaines','users'],['Informatique','laptop'],['Administratif','file'],['Communication','bell'],['Direction générale','book'],['Services techniques','grid'],['Finances','folder']];
let current='accueil';let query='';let toastTimer;function notice(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3400)}function demo(){notice('Lien de démonstration : ajoutez ici l’adresse de votre outil ou document.')}function go(page){current=paths.includes(page)?page:'accueil';query='';document.getElementById('search').value='';location.hash=current==='accueil'?'':current;render();closeMenu();window.scrollTo(0,0)}function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')}function nav(){document.getElementById('nav').innerHTML=paths.map((p,i)=>`<button type="button" class="${p===current?'active':''}" data-page="${p}" ${p===current?'aria-current="page"':''}>${svg(['home','users','file','book','grid','calendar','help'][i])}${labels[i]}</button>`).join('')}
const quick=()=>`<div class="section-head"><h2 class="section-title">Accès rapides</h2><button class="link-btn" data-page="outils">Tous les outils ${svg('arrow')}</button></div><div class="quick-grid">${tools.map(([name,desc,ic])=>`<button class="quick" data-demo><span class="icon">${svg(ic)}</span><strong>${name}</strong><small>${desc}</small></button>`).join('')}</div>`;
const newsPanel=()=>`<section class="panel"><div class="panel-head"><div><h2 class="section-title">Actualités internes</h2><p class="panel-sub">À la une dans la collectivité</p></div></div><div class="news-list">${news.map(([title,description,category,date,ic])=>`<article class="news-item"><div class="news-icon">${svg(ic)}</div><div><strong>${title}</strong><p>${description}</p><div class="meta"><span class="tag">${category}</span><span>${date}</span></div></div></article>`).join('')}</div></section>`;
const events=()=>`<div class="agenda-list"><div class="event"><div class="event-date"><strong>24</strong><small>sept.</small></div><div><strong>Réunion DSI</strong><p>09 h 00 · Salle de réunion</p></div></div><div class="event"><div class="event-date"><strong>28</strong><small>sept.</small></div><div><strong>Formation des agents</strong><p>14 h 00 · Salle multimédia</p></div></div><div class="event"><div class="event-date"><strong>02</strong><small>oct.</small></div><div><strong>Point d’information RH</strong><p>10 h 00 · Salle de réunion</p></div></div></div>`;
const docRows=()=>docs.map(([title,cat])=>`<button class="doc" data-demo>${svg('file')}<span>${title}</span>${svg('arrow')}</button>`).join('');const heading=(title,sub)=>`<div class="welcome"><div><p class="eyebrow">Intranet des agents</p><h1>${title}</h1><p>${sub}</p></div></div>`;
function home(){return `${heading('Bonjour, bienvenue sur votre espace','Vos informations et outils de travail au même endroit.')}${quick()}<div class="layout"><div class="stack">${newsPanel()}<section class="panel"><div class="panel-head"><div><h2 class="section-title">Vos services</h2><p class="panel-sub">Accéder aux informations par service</p></div></div><div class="service-grid">${sections.map(([name,ic])=>`<button class="service" data-page="${name==='Ressources humaines'?'rh':name==='Informatique'?'assistance':'documents'}">${svg(ic)}${name}</button>`).join('')}</div></section></div><div class="stack"><section class="panel"><div class="panel-head"><h2 class="section-title">À retenir</h2></div><div class="notice">${svg('bell')}<div><strong>Maintenance réseau prévue</strong><p>Une intervention est annoncée vendredi. Les horaires seront communiqués aux services.</p></div></div></section><section class="panel"><div class="panel-head"><h2 class="section-title">Agenda</h2><button class="link-btn" data-page="agenda">Voir l’agenda</button></div>${events()}</section><section class="panel"><div class="panel-head"><h2 class="section-title">Documents utiles</h2><button class="link-btn" data-page="documents">Tout voir</button></div><div class="docs">${docRows()}</div></section></div></div>`}
function resource(title,desc,ic,action='demo'){return `<button class="resource" ${action==='demo'?'data-demo':`data-page="${action}"`}><span class="icon">${svg(ic)}</span><strong>${title}</strong><small>${desc}</small></button>`}function page(){switch(current){case'rh':return heading('Mon espace RH','Les démarches et documents utiles à votre parcours.')+`<div class="resource-grid page-panel">${resource('Kelio','Pointage, absences et demandes de congé','clock')}${resource('Digiposte','Consulter vos bulletins de paie','file')}${resource('Formulaires RH','Demandes et documents administratifs','folder','documents')}${resource('Formations','Informations et demandes de formation','book')}${resource('Annuaire des services','Trouver un contact RH','users','annuaire')}</div>`;case'documents':return heading('Documents','Formulaires, modèles et informations pratiques.')+`<div class="simple-list page-panel">${docs.map(([title,cat])=>`<button class="simple-row" data-demo><span><strong>${title}</strong><p>${cat}</p></span>${svg('download')}</button>`).join('')}</div>`;case'annuaire':return heading('Annuaire','Retrouvez les contacts des services de la collectivité.')+`<div class="simple-list page-panel">${people.map(([name,detail,number])=>`<div class="simple-row"><span><strong>${name}</strong><p>${detail}</p></span><span class="tag">${number}</span></div>`).join('')}</div>`;case'outils':return heading('Outils','Vos applications professionnelles en accès rapide.')+`<div class="resource-grid page-panel">${tools.map(([name,desc,ic])=>resource(name,desc,ic)).join('')}</div>`;case'agenda':return heading('Agenda','Les prochains rendez-vous internes.')+`<section class="panel page-panel">${events()}</section>`;case'assistance':return heading('Assistance','Aide informatique et tutoriels pour les agents.')+`<div class="resource-grid page-panel">${resource('Créer une demande GLPI','Signaler un problème informatique','laptop')}${resource('Signature Gmail','Installer votre signature professionnelle','mail')}${resource('Impression sécurisée','Configurer et récupérer vos impressions','shield')}${resource('Utiliser Digiposte','Accéder à vos documents de paie','file')}${resource('Téléphonie 3CX','Utiliser votre poste et vos appels','phone')}${resource('Bureau à distance','Se connecter à votre environnement de travail','grid')}</div>`;default:return home()}}
function searchPage(){let entries=[...tools.map(([n,d,i])=>({n,d,i,p:'outils'})),...docs.map(([n,d])=>({n,d,i:'file',p:'documents'})),...sections.map(([n,i])=>({n,d:'Service',i,p:n==='Ressources humaines'?'rh':n==='Informatique'?'assistance':'documents'})),...labels.map((n,i)=>({n,d:'Rubrique',i:['home','users','file','book','grid','calendar','help'][i],p:paths[i]}))];let matching=entries.filter(x=>(x.n+' '+x.d).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(query.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()));return heading(`Résultats pour « ${query.replaceAll('<','&lt;').replaceAll('>','&gt;')} »`,`${matching.length} résultat${matching.length>1?'s':''} trouvé${matching.length>1?'s':''}`)+(matching.length?`<div class="resource-grid page-panel">${matching.map(x=>resource(x.n,x.d,x.i,x.p)).join('')}</div>`:'<div class="empty page-panel">Aucun résultat. Essayez un autre mot-clé.</div>')}
function render(){nav();document.getElementById('content').innerHTML=(query?searchPage():page())+'<footer class="footer">Ville du Lamentin · Démonstration de l’intranet des agents</footer>';document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.page)));document.querySelectorAll('[data-demo]').forEach(el=>el.addEventListener('click',demo))}document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();render()});document.getElementById('menu').addEventListener('click',()=>{let open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open',open);document.getElementById('menu').setAttribute('aria-expanded',String(open))});document.getElementById('overlay').addEventListener('click',closeMenu);window.addEventListener('hashchange',()=>{current=location.hash.slice(1)||'accueil';render()});document.getElementById('today').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());current=paths.includes(location.hash.slice(1))?location.hash.slice(1):'accueil';render();
