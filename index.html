<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intranet des agents · Ville du Lamentin</title><meta name="description" content="Maquette de l'intranet des agents de la Ville du Lamentin."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2713%27%20fill%3D%27%2348a638%27%2F%3E%3Cpath%20d%3D%27M14%2011v42h38V41H27V11z%27%20fill%3D%27%23f8e928%27%2F%3E%3Cpath%20d%3D%27M14%2051h38v5H14z%27%20fill%3D%27%234469b1%27%2F%3E%3C%2Fsvg%3E"><link rel="stylesheet" href="styles.css"></head><body><div class="overlay" id="overlay"></div><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo-panel"><img src="logo-lamentin.png" alt="Logo de la Ville du Lamentin" width="2048" height="1348"></div><div class="brand-caption"><strong>Ville du Lamentin</strong><small>Intranet des agents</small></div></div><div><p class="nav-label">Espace de travail</p><nav class="nav" id="nav" aria-label="Navigation principale"></nav></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" id="menu" aria-label="Ouvrir le menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Rechercher un outil, un document..." aria-label="Rechercher dans l’intranet"></label><div class="top-actions"><span class="today" id="today"></span><a class="network-login" href="https://192.168.123.251:4100/logon.shtml?redirect=http://192.168.129.245:8089" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le portail d’authentification WatchGuard dans un nouvel onglet"><span class="network-label">Connexion réseau</span><span class="network-short">Réseau</span></a><span class="avatar" aria-hidden="true">AG</span><span class="top-name">Espace agent</span></div></header><div class="content" id="content"></div></main></div><div id="toast" class="toast" role="status" hidden></div><script>
const paths=['accueil','rh','documents','annuaire','outils','agenda'];const labels=['Accueil','Mon espace RH','Documents','Annuaire','Outils','Agenda'];const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2zM17 6a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5"/>',file:'<path d="M6 2h8l5 5v15H6zM14 2v6h5M9 13h7M9 17h7"/>',book:'<path d="M4 3h16v18H4zM8 3v18M11 8h6M11 12h5"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2l-1.5 1.2V14M12 17h.01"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',mail:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="m2 6 10 7 10-7"/>',phone:'<path d="M7 3 4 5c-2 2 1 8 5 12s10 7 12 5l-2-4-4 1-6-6 1-4z"/>',folder:'<path d="M2 6h8l2 2h10v13H2z"/>',laptop:'<rect x="4" y="3" width="16" height="13" rx="1"/><path d="M2 20h20l-2-4H4z"/>',bell:'<path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 20h4"/>',arrow:'<path d="m8 5 7 7-7 7"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 20h16"/>',shield:'<path d="m12 2 8 3v6c0 5-3 9-8 11-5-2-8-6-8-11V5z"/>'};const svg=(key)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[key]||icons.file}</svg>`;
const watchguardUrl='https://192.168.123.251:4100/logon.shtml?redirect=http://192.168.129.245:8089';const toolUrls={Kelio:'http://192.168.129.245:8089/open/login',Gmail:'https://mail.google.com/mail/u/1/#inbox',Digiposte:'https://secure.digiposte.fr/identification-plus',GLPI:'http://192.168.129.17/glpi/index.php?noAUTO=1','3CX':'https://gp-commune-du-lamentin.3cx.eu/#/people',Ciril:'https://ville-lamentin.ciril.net'};const tools=[['Kelio','Pointage et absences','clock'],['Gmail','Messagerie','mail'],['Digiposte','Bulletins de paie','file'],['GLPI','Assistance informatique','laptop'],['3CX','Téléphonie','phone'],['Ciril','Gestion administrative','folder']];const news=[['Nouvelle procédure de demande de congé','Retrouvez les étapes et le formulaire dans votre espace RH.','Ressources humaines','18 septembre 2026','file'],['Séminaire des agents : informations pratiques','Consultez le programme et les consignes pour la journée.','Vie de la collectivité','15 septembre 2026','users'],['Maintenance programmée de Ciril','Une intervention technique est prévue sur Ciril.','Informatique','12 septembre 2026','laptop']];const docs=[['Demande de congé, absence ou formation','Congés et absences','documents/demande-conge-absence-formation.pdf'],['Congé exceptionnel, report ou absence syndicale','Congés et absences','documents/demande-conge-exceptionnel-report-absence-syndicale.pdf'],['Demande de récupération','Temps de travail','documents/demande-recuperation.pdf'],['État des heures supplémentaires','Temps et paie','documents/etat-heures-supplementaires.pdf'],['Ordre de mission','Déplacements','documents/ordre-de-mission.pdf'],['Formulaire de contact et demande RH','Ressources humaines','documents/formulaire-contact-demande-depot-rh.pdf']];const sections=[['Ressources humaines','users'],['Informatique','laptop'],['Administratif','file'],['Communication','bell'],['Direction générale','book'],['Services techniques','grid'],['Finances','folder']];
let current='accueil';let query='';let toastTimer;let directory=[];let directoryStatus='loading';function notice(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3400)}function demo(){notice('Lien de démonstration : ajoutez ici l’adresse de votre outil ou document.')}function go(page){current=paths.includes(page)?page:'accueil';query='';document.getElementById('search').value='';location.hash=current==='accueil'?'':current;render();closeMenu();window.scrollTo(0,0)}function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')}function nav(){document.getElementById('nav').innerHTML=paths.map((p,i)=>`<button type="button" class="${p===current?'active':''}" data-page="${p}" ${p===current?'aria-current="page"':''}>${svg(['home','users','file','book','grid','calendar'][i])}${labels[i]}</button>`).join('')}
const quick=()=>`<div class="section-head"><h2 class="section-title">Accès rapides</h2><button class="link-btn" data-page="outils">Tous les outils ${svg('arrow')}</button></div><div class="quick-grid">${tools.map(([name,desc,ic])=>`<a class="quick" href="${toolUrls[name]}" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir ${name} dans un nouvel onglet"><span class="icon">${svg(ic)}</span><strong>${name}</strong><small>${desc}</small></a>`).join('')}</div>`;
const newsPanel=()=>`<section class="panel"><div class="panel-head"><div><h2 class="section-title">Actualités internes</h2><p class="panel-sub">À la une dans la collectivité</p></div></div><div class="news-list">${news.map(([title,description,category,date,ic])=>`<article class="news-item"><div class="news-icon">${svg(ic)}</div><div><strong>${title}</strong><p>${description}</p><div class="meta"><span class="tag">${category}</span><span>${date}</span></div></div></article>`).join('')}</div></section>`;
const events=()=>`<div class="agenda-list"><div class="event"><div class="event-date"><strong>24</strong><small>sept.</small></div><div><strong>Réunion DSI</strong><p>09 h 00 · Salle de réunion</p></div></div><div class="event"><div class="event-date"><strong>28</strong><small>sept.</small></div><div><strong>Formation des agents</strong><p>14 h 00 · Salle multimédia</p></div></div><div class="event"><div class="event-date"><strong>02</strong><small>oct.</small></div><div><strong>Point d’information RH</strong><p>10 h 00 · Salle de réunion</p></div></div></div>`;
const docRows=()=>docs.slice(0,4).map(([title,cat,url])=>`<a class="doc" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir ${title} en PDF">${svg('file')}<span>${title}</span>${svg('arrow')}</a>`).join('');const heading=(title,sub)=>`<div class="welcome"><div><p class="eyebrow">Intranet des agents</p><h1>${title}</h1><p>${sub}</p></div></div>`;
function home(){return `${heading('Bonjour, bienvenue sur votre espace','Vos informations et outils de travail au même endroit.')}${quick()}<a class="generator-link" href="http://192.168.129.220/index.html" target="_blank" rel="noopener noreferrer"><span class="icon">${svg('file')}</span><span class="copy"><strong>Signature mail et carte de visite</strong><small>Créer vos supports avec le générateur de la Ville</small></span><span class="cta">Ouvrir le générateur ↗</span></a><div class="layout"><div class="stack">${newsPanel()}<section class="panel"><div class="panel-head"><div><h2 class="section-title">Vos services</h2><p class="panel-sub">Accéder aux informations par service</p></div></div><div class="service-grid">${sections.map(([name,ic])=>`<button class="service" data-page="${name==='Ressources humaines'?'rh':name==='Informatique'?'outils':'documents'}">${svg(ic)}${name}</button>`).join('')}</div></section></div><div class="stack"><section class="panel"><div class="panel-head"><h2 class="section-title">À retenir</h2></div><div class="notice">${svg('bell')}<div><strong>Maintenance réseau prévue</strong><p>Une intervention est annoncée vendredi. Les horaires seront communiqués aux services.</p></div></div></section><section class="panel"><div class="panel-head"><h2 class="section-title">Agenda</h2><button class="link-btn" data-page="agenda">Voir l’agenda</button></div>${events()}</section><section class="panel"><div class="panel-head"><h2 class="section-title">Documents utiles</h2><button class="link-btn" data-page="documents">Tout voir</button></div><div class="docs">${docRows()}</div></section></div></div>`}
function resource(title,desc,ic,action='demo'){const external=action.startsWith('http')||action.startsWith('documents/');return `<${external?'a':'button'} class="resource" ${external?`href="${action}" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir ${title} dans un nouvel onglet"`:action==='demo'?'data-demo':`data-page="${action}"`}><span class="icon">${svg(ic)}</span><strong>${title}</strong><small>${desc}</small></${external?'a':'button'}>`}function page(){switch(current){case'rh':return heading('Mon espace RH','Les démarches et documents utiles à votre parcours.')+`<div class="resource-grid page-panel">${resource('Kelio','Pointage, absences et demandes de congé','clock',toolUrls.Kelio)}${resource('Digiposte','Consulter vos bulletins de paie','file',toolUrls.Digiposte)}${resource('Formulaires RH','Demandes et documents administratifs','folder','documents')}${resource('Formations','Informations et demandes de formation','book')}${resource('Annuaire des services','Trouver un contact RH','users','annuaire')}</div>`;case'documents':return heading('Documents','Formulaires, modèles et informations pratiques.')+`<div class="simple-list page-panel">${docs.map(([title,cat,url])=>`<a class="simple-row" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir ${title} en PDF"><span><strong>${title}</strong><p>${cat} · PDF</p></span>${svg('arrow')}</a>`).join('')}</div>`;case'annuaire':return directoryPage();case'outils':return heading('Outils','Vos applications professionnelles en accès rapide. Certains accès nécessitent le réseau de la Ville.')+`<div class="resource-grid page-panel">${tools.map(([name,desc,ic])=>resource(name,desc,ic,toolUrls[name])).join('')}${resource('Connexion réseau WatchGuard','Authentification réseau, puis ouverture de Kelio','shield',watchguardUrl)}<a class="resource" href="http://192.168.129.220/index.html" target="_blank" rel="noopener noreferrer"><span class="icon">${svg('file')}</span><strong>Signature mail et carte de visite</strong><small>Ouvrir le générateur de la Ville ↗</small></a></div>`;case'agenda':return heading('Agenda','Les prochains rendez-vous internes.')+`<section class="panel page-panel">${events()}</section>`;default:return home()}}

const html=(value)=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const dial=(value)=>String(value||'').replace(/[^+0-9]/g,'');
function directoryPage(){const departments=[...new Set(directory.map(c=>c.department).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));return heading('Annuaire 3CX','Rechercher un agent, un service ou un numéro de poste.')+`<section class="panel page-panel directory-panel"><div class="directory-toolbar"><div><h2 class="section-title">Contacts 3CX</h2><p class="panel-sub">${directoryStatus==='loading'?'Chargement de l’annuaire…':directory.length?`${directory.length} fiche${directory.length>1?'s':''} de l’export 3CX`:'Aucune donnée 3CX chargée'}</p></div><input id="directory-file" class="visually-hidden" type="file" accept=".csv,text/csv" multiple aria-label="Importer des exports CSV 3CX"><label class="import-button" for="directory-file">${svg('folder')} Importer un autre export</label></div><p class="directory-help">Annuaire issu de l’export 3CX fourni. Un nouvel import CSV modifie l’affichage seulement dans ce navigateur, jusqu’au rechargement de la page.</p>${directory.length?`<div class="directory-controls"><input id="directory-search" type="search" placeholder="Rechercher un nom, un service, un poste..." aria-label="Rechercher un contact 3CX"><select id="directory-type" aria-label="Filtrer les contacts"><option value="all">Tous les contacts</option><option value="agent">Agents</option><option value="contact">Carnet d’entreprise</option></select><select id="directory-department" aria-label="Filtrer par service"><option value="all">Tous les services</option>${departments.map(dep=>`<option value="${html(dep)}">${html(dep)}</option>`).join('')}</select></div><p class="directory-count" id="directory-count"></p><div class="directory-list" id="directory-list">${directory.map(contactRow).join('')}</div>`:`<div class="directory-empty">${svg('users')}<strong>${directoryStatus==='loading'?'Chargement de l’annuaire 3CX':'Annuaire indisponible'}</strong><p>${directoryStatus==='loading'?'Les contacts s’afficheront dans un instant.':'Vous pouvez importer un export CSV des utilisateurs ou du carnet d’entreprise.'}</p></div>`}</section>`}

function contactRow(c){const initials=(c.name.match(/\b[\p{L}]/gu)||[]).slice(0,2).join('').toUpperCase();const ext=c.extension?`<a class="directory-number" href="tel:${dial(c.extension)}" aria-label="Appeler le poste ${html(c.extension)}">Poste ${html(c.extension)}</a>`:'';const phone=c.phone?`<a href="tel:${dial(c.phone)}">${svg('phone')}${html(c.phone)}</a>`:'';const mail=c.email?`<a href="mailto:${encodeURIComponent(c.email)}">${svg('mail')}${html(c.email)}</a>`:'';return `<article class="directory-row" data-type="${c.type}" data-department="${html(c.department)}" data-search="${html([c.name,c.department,c.extension,c.phone,c.email].join(' ').toLowerCase())}"><span class="directory-avatar">${html(initials||'?')}</span><div class="directory-person"><strong>${html(c.name)}</strong><span>${html(c.department|| (c.type==='agent'?'Agent':'Contact'))}</span></div><div class="directory-details">${ext}${phone}${mail}</div></article>`}
function parseCSV(input){const first=input.replace(/^\uFEFF/,'').split(/\r?\n/,1)[0];const count=(d)=>{let quoted=false,n=0;for(const ch of first){if(ch==='"')quoted=!quoted;else if(ch===d&&!quoted)n++}return n};const delimiter=count(';')>count(',')?';':',';let rows=[],row=[],cell='',quoted=false;input=input.replace(/^\uFEFF/,'');for(let i=0;i<input.length;i++){const ch=input[i];if(quoted){if(ch==='"'&&input[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===delimiter){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&input[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}if(quoted)throw Error('Guillemets non fermés dans le CSV.');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
function mapCSV(text){const rows=parseCSV(text);if(rows.length<2)throw Error('Le fichier CSV ne contient aucun contact.');const columns=rows.shift().map(x=>x.trim().toLowerCase().replace(/[^a-z0-9]/g,''));const field=(row,key)=>{const index=columns.indexOf(key.toLowerCase());return index<0?'':(row[index]||'').trim()};const agent=columns.includes('number')&&columns.includes('firstname');const contact=columns.includes('firstname')&&(columns.includes('business')||columns.includes('mobile'));if(!agent&&!contact)throw Error('Format 3CX non reconnu : exportez les utilisateurs ou le carnet d’entreprise.');return rows.filter(row=>agent?field(row,'HideInPhonebook')!=='1':true).map(row=>{let name=[field(row,'FirstName'),field(row,'LastName')].filter(Boolean).join(' ').trim();return {name,department:field(row,'Department')||field(row,'Company')||field(row,'Title'),extension:agent?field(row,'Number'):'',phone:field(row,agent?'MobileNumber':'Business')||field(row,'Mobile')||field(row,'Home'),email:field(row,agent?'EmailAddress':'Email'),type:agent?'agent':'contact'}}).filter(c=>c.name)}
async function importDirectory(files){if(!files.length)return;try{let imported=[];for(const file of files){if(file.size>5_000_000)throw Error('Fichier trop volumineux (5 Mo maximum).');let buffer=await file.arrayBuffer();let decoded=new TextDecoder('utf-8').decode(buffer);if(decoded.includes('�'))decoded=new TextDecoder('windows-1252').decode(buffer);imported.push(...mapCSV(decoded))}const seen=new Set();directory=[...directory,...imported].filter(c=>{const key=[c.type,c.extension,c.email,c.name,c.phone].join('|').toLowerCase();if(seen.has(key))return false;seen.add(key);return true}).sort((a,b)=>a.name.localeCompare(b.name,'fr'));render();notice(`${imported.length} fiche${imported.length>1?'s':''} 3CX importée${imported.length>1?'s':''}.`)}catch(error){notice(error.message||'Impossible de lire ce fichier.')}}
function filterDirectory(){const search=document.getElementById('directory-search');const select=document.getElementById('directory-type');const department=document.getElementById('directory-department');if(!search||!select)return;const value=search.value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let count=0;document.querySelectorAll('.directory-row').forEach(row=>{const haystack=row.dataset.search.normalize('NFD').replace(/[\u0300-\u036f]/g,'');const visible=(select.value==='all'||row.dataset.type===select.value)&&(!department||department.value==='all'||row.dataset.department===department.value)&&haystack.includes(value);row.hidden=!visible;if(visible)count++});document.getElementById('directory-count').textContent=`${count} résultat${count>1?'s':''}`}

function searchPage(){let entries=[{n:'Signature mail et carte de visite',d:'Générateur de la Ville',i:'file',p:'outils'},...tools.map(([n,d,i])=>({n,d,i,p:'outils',url:toolUrls[n]})),...docs.map(([n,d,url])=>({n,d,i:'file',p:'documents',url})),...sections.map(([n,i])=>({n,d:'Service',i,p:n==='Ressources humaines'?'rh':n==='Informatique'?'outils':'documents'})),...labels.map((n,i)=>({n,d:'Rubrique',i:['home','users','file','book','grid','calendar'][i],p:paths[i]}))];let matching=entries.filter(x=>(x.n+' '+x.d).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(query.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()));return heading(`Résultats pour « ${query.replaceAll('<','&lt;').replaceAll('>','&gt;')} »`,`${matching.length} résultat${matching.length>1?'s':''} trouvé${matching.length>1?'s':''}`)+(matching.length?`<div class="resource-grid page-panel">${matching.map(x=>resource(x.n,x.d,x.i,x.url||x.p)).join('')}</div>`:'<div class="empty page-panel">Aucun résultat. Essayez un autre mot-clé.</div>')}
function render(){nav();document.getElementById('content').innerHTML=(query?searchPage():page())+'<footer class="footer">Ville du Lamentin · Démonstration de l’intranet des agents</footer>';document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.page)));document.querySelectorAll('[data-demo]').forEach(el=>el.addEventListener('click',demo));document.getElementById('directory-file')?.addEventListener('change',e=>importDirectory([...e.target.files]));document.getElementById('directory-search')?.addEventListener('input',filterDirectory);document.getElementById('directory-type')?.addEventListener('change',filterDirectory);document.getElementById('directory-department')?.addEventListener('change',filterDirectory);filterDirectory()}document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();render()});document.getElementById('menu').addEventListener('click',()=>{let open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open',open);document.getElementById('menu').setAttribute('aria-expanded',String(open))});document.getElementById('overlay').addEventListener('click',closeMenu);window.addEventListener('hashchange',()=>{current=paths.includes(location.hash.slice(1))?location.hash.slice(1):'accueil';render()});document.getElementById('today').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());current=paths.includes(location.hash.slice(1))?location.hash.slice(1):'accueil';render();fetch('annuaire-3cx.json').then(response=>{if(!response.ok)throw Error('Annuaire indisponible');return response.json()}).then(contacts=>{if(!Array.isArray(contacts))throw Error('Format invalide');directory=contacts;directoryStatus='ready';render()}).catch(()=>{directoryStatus='error';render()});
</script></body></html>
